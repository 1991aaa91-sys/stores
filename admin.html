<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f1720">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>لوحة الأدمن</title>
<style>
:root{--c:#ec4899;--bg:#faf6f4;--cd:#fff;--tx:#1f1720;--mu:#8a7f87;--bd:#efe6e2;--sh:0 6px 20px rgba(60,30,50,.08)}
*{box-sizing:border-box;margin:0;font-family:Cairo,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.cen{text-align:center;padding:30vh 20px 0;color:var(--mu)}
.box{background:var(--cd);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.fi{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;outline:0}
.fi:focus{border-color:var(--c)}
.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:var(--c);color:#fff;font-size:16px;font-weight:800}
.lnk{display:block;margin:12px auto 0;background:none;border:0;color:var(--mu);font-size:14px;text-decoration:underline}
.err{color:#d93025;font-size:13px;margin-top:10px;text-align:center}
.top{background:var(--tx);color:#fff;padding:20px 16px;border-radius:0 0 24px 24px}
.top div{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:20px;font-weight:800}
.top button{background:#ffffff22;border:0;color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;font-weight:600}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st div{background:var(--cd);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:var(--sh)}
.st b{display:block;font-size:20px}
.st small{color:var(--mu);font-size:11px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;padding:8px 16px;border-radius:20px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-size:14px;font-weight:600}
.chip.on{background:var(--tx);border-color:var(--tx);color:#fff}
.sc{background:var(--cd);border-radius:18px;padding:14px;box-shadow:var(--sh);margin-top:10px}
.sc h3{font-size:16px}
.sc .m{color:var(--mu);font-size:12px;direction:ltr;text-align:right;margin-top:2px}
.tg{display:inline-block;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:700;margin-top:8px}
.tg.ok{background:#e6f6ec;color:#146c2e}
.tg.warn{background:#fff4d6;color:#8a5a00}
.tg.bad{background:#fde7e7;color:#b3261e}
.ac{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ac button,.ac a{padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:none;color:var(--tx);font-size:12px;font-weight:700;text-decoration:none}
.ac .g{background:#e6f6ec;border-color:#bfe3cb;color:#146c2e}
.ac .r{color:#b3261e}
.emp{text-align:center;color:var(--mu);padding:30px}
</style>
</head>
<body>

<div id="ld" class="cen">جاري التحميل...</div>

<div id="login" class="wrap" hidden>
  <div class="box" style="margin-top:12vh">
    <h2>🔐 لوحة الأدمن</h2>
    <label>الإيميل</label><input id="em" type="email" class="fi" dir="ltr">
    <label>الباسورد</label><input id="pw" type="password" class="fi" dir="ltr">
    <button class="btn" id="go" onclick="doLogin()">دخول</button>
    <div id="err" class="err"></div>
  </div>
</div>

<div id="noadmin" class="wrap" hidden>
  <div class="box" style="margin-top:12vh;text-align:center">
    <h2>⛔ الحساب ده مش أدمن</h2>
    <p style="color:var(--mu);margin-top:6px" id="nad"></p>
    <button class="btn" onclick="out()">تسجيل خروج</button>
  </div>
</div>

<div id="dash" hidden>
  <div class="top"><div><h1>لوحة الأدمن</h1><button onclick="reload()">تحديث</button></div></div>
  <div class="wrap">
    <div class="st" id="st"></div>
    <input id="q" class="fi" placeholder="🔍 دوري بالاسم أو اللينك أو الرقم">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
    <button class="lnk" onclick="out()">تسجيل خروج</button>
  </div>
</div>

<script type="module">
import {auth,db} from './firebase-config.js';
import {signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {doc,getDoc,getDocs,updateDoc,collection,Timestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $=id=>document.getElementById(id);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const DAY=864e5;
const FILTERS=[['all','الكل'],['active','شغالة'],['soon','قربت تخلص'],['exp','منتهية']];
let rows=[],filter='all',q='';

function show(id){['ld','login','noadmin','dash'].forEach(x=>$(x).hidden=x!=id);}

async function doLogin(){
  $('err').textContent='';$('go').disabled=true;
  try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);}
  catch(x){$('err').textContent='الإيميل أو الباسورد غلط';}
  $('go').disabled=false;
}
function out(){signOut(auth);}

onAuthStateChanged(auth,async u=>{
  if(!u){show('login');return;}
  show('ld');
  try{
    const a=await getDoc(doc(db,'admins',u.uid));
    if(!a.exists()){$('nad').textContent=u.email||'';show('noadmin');return;}
    await load();show('dash');
  }catch(x){alert('مشكلة في التحميل: '+x.message);show('login');}
});

async function load(){
  const s=await getDocs(collection(db,'stores'));
  rows=s.docs.map(d=>({uid:d.id,...d.data()}));
  draw();
}
async function reload(){try{await load();}catch(x){alert('خطأ: '+x.message);}}

const ms=r=>r.expiresAt&&r.expiresAt.toMillis?r.expiresAt.toMillis():0;
const days=r=>Math.ceil((ms(r)-Date.now())/DAY);
const cls=r=>{const d=days(r);return d<=0?'exp':d<=3?'soon':'active';};
const goodSlug=s=>/^[a-z0-9-]{3,30}$/.test(s||'');
const fmt=t=>new Date(t).toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'});

function draw(){
  const c={all:rows.length,active:0,soon:0,exp:0};
  rows.forEach(r=>{const k=cls(r);if(k=='exp')c.exp++;else{c.active++;if(k=='soon')c.soon++;}});
  $('st').innerHTML=`<div><b>${c.all}</b><small>الكل</small></div><div><b>${c.active}</b><small>شغالة</small></div><div><b>${c.soon}</b><small>قربت تخلص</small></div><div><b>${c.exp}</b><small>منتهية</small></div>`;
  $('chips').innerHTML=FILTERS.map(([k,l])=>`<button class="chip${k==filter?' on':''}" onclick="setF('${k}')">${l}</button>`).join('');
  const l=rows.filter(r=>{
    const k=cls(r);
    if(filter=='active'&&k=='exp')return false;
    if(filter=='soon'&&k!='soon')return false;
    if(filter=='exp'&&k!='exp')return false;
    if(q&&!((r.name||'')+' '+(r.slug||'')+' '+(r.whatsapp||'')).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>ms(a)-ms(b));
  $('list').innerHTML=l.map(card).join('')||'<div class="emp">مفيش نتائج</div>';
}
function card(r){
  const d=days(r),k=cls(r);
  const tag=k=='exp'?`<span class="tg bad">منتهي من ${Math.abs(d)} يوم</span>`:k=='soon'?`<span class="tg warn">باقي ${d} يوم</span>`:`<span class="tg ok">شغال، باقي ${d} يوم</span>`;
  const wa=String(r.whatsapp||'').replace(/\D/g,'');
  const link=goodSlug(r.slug)?new URL('store.html?s='+r.slug,location.href).href:'';
  return `<div class="sc">
    <h3>${e(r.name)}</h3>
    <div class="m">${e(r.slug)} • ${e(wa)}</div>
    ${tag}<div class="m" style="margin-top:6px">ينتهي: ${e(fmt(ms(r)))}</div>
    <div class="ac">
      <button onclick="ext('${e(r.uid)}',30)">+30 يوم</button>
      <button onclick="ext('${e(r.uid)}',90)">+90 يوم</button>
      <button onclick="ext('${e(r.uid)}',365)">+سنة</button>
      <button class="r" onclick="stop('${e(r.uid)}')">إيقاف</button>
      ${link?`<a href="${e(link)}" target="_blank" rel="noopener">فتح المتجر</a>`:''}
      ${wa?`<a class="g" href="https://wa.me/${wa}" target="_blank" rel="noopener">واتساب</a>`:''}
    </div>
  </div>`;
}
function setF(k){filter=k;draw();}
$('q').oninput=ev=>{q=ev.target.value.trim().toLowerCase();draw();};

async function ext(uid,n){
  try{
    const r=rows.find(x=>x.uid==uid);
    const t=Timestamp.fromMillis(Math.max(Date.now(),ms(r))+n*DAY);
    await updateDoc(doc(db,'stores',uid),{expiresAt:t});
    r.expiresAt=t;draw();
  }catch(x){alert('خطأ: '+x.message);}
}
async function stop(uid){
  if(!confirm('إيقاف المتجر دلوقتي؟'))return;
  try{
    const r=rows.find(x=>x.uid==uid);
    const t=Timestamp.fromMillis(Date.now()-1000);
    await updateDoc(doc(db,'stores',uid),{expiresAt:t});
    r.expiresAt=t;draw();
  }catch(x){alert('خطأ: '+x.message);}
}

Object.assign(window,{doLogin,out,reload,setF,ext,stop});
</script>
</body>
</html>
