<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ec4899">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>لوحة التحكم</title>
<style>
:root{--c:#ec4899;--bg:#faf6f4;--cd:#fff;--tx:#1f1720;--mu:#8a7f87;--bd:#efe6e2;--sh:0 6px 20px rgba(60,30,50,.08)}
*{box-sizing:border-box;margin:0;font-family:Cairo,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--tx);min-height:100vh}
.ld{text-align:center;padding:40vh 0;color:var(--mu)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.brand{text-align:center;padding:28px 0 18px}
.lg{width:78px;height:78px;border-radius:24px;margin:0 auto 12px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 10px 26px color-mix(in srgb,var(--c) 40%,transparent)}
.brand h1{font-size:26px;font-weight:800}
.brand p{color:var(--mu);font-size:14px;margin-top:4px}
.box{background:var(--cd);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.box h2{font-size:20px;margin-bottom:4px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
small{color:var(--mu);font-size:12px}
.fi{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;outline:0}
.fi:focus{border-color:var(--c)}
.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:var(--c);color:#fff;font-size:16px;font-weight:800;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 35%,transparent)}
.btn:disabled{opacity:.6}
.lnk{display:block;margin:12px auto 0;background:none;border:0;color:var(--mu);font-size:14px;text-decoration:underline}
.err{color:#d93025;font-size:13px;margin-top:10px;text-align:center}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:6px}
.seg button{flex:1;padding:10px;border:0;border-radius:11px;background:none;font-size:15px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--cd);color:var(--c);box-shadow:var(--sh)}
.top{background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));color:#fff;padding:22px 16px;border-radius:0 0 26px 26px}
.top div{max-width:560px;margin:0 auto}
.top h1{font-size:22px;font-weight:800}
.top p{opacity:.85;font-size:13px}
.sub{padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;margin-bottom:14px}
.sub a{color:inherit;text-decoration:underline}
.sub.ok{background:#e6f6ec;color:#146c2e}
.sub.warn{background:#fff4d6;color:#8a5a00}
.sub.bad{background:#fde7e7;color:#b3261e}
.lkb{direction:ltr;text-align:left;background:var(--bg);border-radius:12px;padding:10px;font-size:12px;word-break:break-all;color:var(--mu);margin-top:8px}
.row3{display:flex;gap:8px;margin-top:10px}
.row3 button{flex:1;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);font-size:13px;font-weight:700}
.pr{display:flex;gap:12px;background:var(--cd);border-radius:16px;padding:10px;box-shadow:var(--sh);margin-top:10px}
.pi{width:78px;height:78px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;flex:none}
.pi img{width:100%;height:100%;object-fit:cover}
.pm{flex:1;min-width:0}
.pm b{display:block;font-size:15px}
.pc{color:var(--c);font-weight:800;margin:2px 0 6px}
.red{color:#d93025}
.pa{display:flex;gap:6px}
.pa button{padding:6px 12px;border:1px solid var(--bd);border-radius:10px;background:none;color:var(--tx);font-size:12px;font-weight:600}
.pa .dl{color:#d93025}
.emp{text-align:center;color:var(--mu);padding:30px 10px}
.up{height:150px;border:2px dashed var(--bd);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--mu);overflow:hidden;cursor:pointer}
.up img{width:100%;height:100%;object-fit:cover}
#sheet{position:fixed;inset:0;background:#0009;z-index:9;display:none}
#sheet.on{display:flex;align-items:flex-end}
.sh{background:var(--cd);width:100%;max-width:560px;margin:0 auto;max-height:94vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px 28px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px}
.chk input{width:20px;height:20px}
</style>
</head>
<body>

<div id="ld" class="ld">جاري التحميل...</div>

<div id="auth" class="wrap" hidden>
  <div class="brand"><div class="lg">🛍️</div><h1>متجرك الخاص</h1><p>افتحي متجرك الإلكتروني في دقايق وابعتي لينكه لزباينك</p></div>
  <div class="box">
    <div class="seg"><button id="tl" class="on" onclick="mode('login')">دخول</button><button id="tr" onclick="mode('reg')">حساب جديد</button></div>
    <label>الإيميل</label>
    <input id="em" type="email" class="fi" dir="ltr" placeholder="name@example.com">
    <label>الباسورد</label>
    <input id="pw" type="password" class="fi" dir="ltr" placeholder="6 حروف على الأقل">
    <button class="btn" id="goA" onclick="doAuth()">دخول</button>
    <button class="lnk" onclick="reset()">نسيتي الباسورد؟</button>
    <div id="err" class="err"></div>
  </div>
</div>

<div id="setup" class="wrap" hidden>
  <div class="box">
    <h2>جهّزي متجرك ✨</h2>
    <small>بياناتك دي تقدري تغيريها بعدين (ماعدا اللينك).</small>
    <label>اسم المتجر</label>
    <input id="sn" class="fi" placeholder="مثال: لمسة">
    <label>لينك المتجر (حروف إنجليزي وأرقام بس)</label>
    <input id="ss" class="fi" dir="ltr" placeholder="lamsa">
    <small>متجرك هيبقى: store.html?s=<b id="pv">...</b></small>
    <label>رقم واتساب الطلبات</label>
    <input id="sw" type="tel" class="fi" dir="ltr" placeholder="01xxxxxxxxx">
    <label>لون المتجر</label>
    <input id="sc" type="color" value="#ec4899" class="fi" style="height:48px;padding:4px">
    <button class="btn" onclick="createStore()">إنشاء المتجر (تجربة 7 أيام مجانًا)</button>
    <button class="lnk" onclick="out()">تسجيل خروج</button>
    <div id="err2" class="err"></div>
  </div>
</div>

<div id="dash" hidden>
  <div class="top"><div><h1 id="dn"></h1><p>لوحة التحكم</p></div></div>
  <div class="wrap">
    <div id="sub" class="sub"></div>
    <div class="box">
      <b>🔗 لينك متجرك</b>
      <div class="lkb" id="lk"></div>
      <div class="row3">
        <button onclick="copyLink()">نسخ</button>
        <button onclick="shareWA()">واتساب</button>
        <button onclick="openStore()">فتح</button>
      </div>
    </div>

    <div class="seg">
      <button id="tb1" class="on" onclick="tab('p')">المنتجات</button>
      <button id="tb2" onclick="tab('s')">إعدادات المتجر</button>
    </div>

    <div id="tp">
      <button class="btn" style="margin-top:8px" onclick="openP()">+ إضافة منتج</button>
      <div id="pl"></div>
    </div>

    <div id="ts" hidden>
      <div class="box">
        <div class="up" style="height:110px" onclick="document.getElementById('lgfile').click()">
          <img id="lgimg" hidden><span id="lgtxt">📷 إضافة لوجو</span>
        </div>
        <input id="lgfile" type="file" accept="image/*" hidden>
        <label>اسم المتجر</label><input id="f_name" class="fi">
        <label>وصف قصير تحت الاسم</label><input id="f_tag" class="fi" placeholder="شغل بحب 💕">
        <label>رقم واتساب الطلبات</label><input id="f_wa" type="tel" class="fi" dir="ltr">
        <div class="g2">
          <div><label>اللون</label><input id="f_col" type="color" class="fi" style="height:46px;padding:4px"></div>
          <div><label>الشكل</label><select id="f_theme" class="fi"><option value="light">فاتح</option><option value="dark">داكن</option></select></div>
        </div>
        <div class="g2">
          <div><label>سعر الشحن</label><input id="f_ship" type="number" class="fi"></div>
          <div><label>شحن مجاني فوق</label><input id="f_free" type="number" class="fi" placeholder="0 = مفيش"></div>
        </div>
        <label>طرق الدفع (افصلي بفاصلة)</label><input id="f_pay" class="fi">
        <label>شارات تحت الاسم (افصلي بفاصلة)</label><input id="f_bad" class="fi">
        <button class="btn" onclick="saveSet()">حفظ الإعدادات</button>
      </div>
    </div>
    <button class="lnk" onclick="out()">تسجيل خروج</button>
  </div>
</div>

<div id="sheet" onclick="if(event.target.id=='sheet')closeP()">
  <div class="sh">
    <div class="hd"><h3 id="st">منتج جديد</h3><button class="x" onclick="closeP()">✕</button></div>
    <div class="up" onclick="document.getElementById('file').click()">
      <img id="pimg" hidden><span id="pph">📷 اضغطي لإضافة صورة</span>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
    <label>اسم المنتج</label><input id="pn" class="fi">
    <div class="g2">
      <div><label>السعر</label><input id="pp" type="number" inputmode="decimal" class="fi"></div>
      <div><label>قبل الخصم (اختياري)</label><input id="po" type="number" inputmode="decimal" class="fi"></div>
    </div>
    <label>القسم (اختياري)</label><input id="pc" class="fi" placeholder="فساتين، إكسسوار...">
    <label>الوصف (اختياري)</label><input id="pd" class="fi">
    <label>نوع الاختيارات (اختياري)</label><input id="pl2" class="fi" placeholder="المقاس أو اللون">
    <label>الاختيارات (افصلي بفاصلة)</label><input id="pops" class="fi" placeholder="S, M, L">
    <label class="chk"><input type="checkbox" id="pso"> نفدت الكمية</label>
    <button class="btn" id="svp" onclick="saveP()">حفظ المنتج</button>
  </div>
</div>

<script type="module">
import {auth,db,CLOUD_NAME,UPLOAD_PRESET} from './firebase-config.js';
import {createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {doc,getDoc,setDoc,updateDoc,deleteDoc,collection,getDocs,addDoc,Timestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const SUPPORT_WHATSAPP="201000000000"; // غيّره لرقم واتساب بتاعك (بالكود الدولي)
const $=id=>document.getElementById(id);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const split=s=>s.split(/[,،]/).map(x=>x.trim()).filter(Boolean);
const tc=f=>async(...a)=>{try{await f(...a)}catch(x){alert('حصل خطأ: '+x.message)}};
let user=null,store=null,prods=[],editId=null,imgUrl='',logoUrl='',isReg=false;

function show(id){['ld','auth','setup','dash'].forEach(x=>$(x).hidden=x!=id);}
function mode(m){isReg=m=='reg';$('tl').classList.toggle('on',!isReg);$('tr').classList.toggle('on',isReg);$('goA').textContent=isReg?'إنشاء حساب':'دخول';$('err').textContent='';}
function authMsg(c){return({'auth/email-already-in-use':'الإيميل ده مسجل قبل كده، جربي تدخلي.','auth/invalid-credential':'الإيميل أو الباسورد غلط.','auth/wrong-password':'الإيميل أو الباسورد غلط.','auth/user-not-found':'الإيميل أو الباسورد غلط.','auth/weak-password':'الباسورد لازم يكون 6 حروف على الأقل.','auth/invalid-email':'الإيميل مش مظبوط.','auth/too-many-requests':'محاولات كتير، جربي بعد شوية.','auth/network-request-failed':'مفيش اتصال بالنت.'})[c]||'حصل خطأ، حاولي تاني.';}
async function doAuth(){
  const em=$('em').value.trim(),pw=$('pw').value;
  $('err').textContent='';
  if(!em||!pw){$('err').textContent='اكتبي الإيميل والباسورد';return;}
  $('goA').disabled=true;
  try{isReg?await createUserWithEmailAndPassword(auth,em,pw):await signInWithEmailAndPassword(auth,em,pw);}
  catch(x){$('err').textContent=authMsg(x.code);}
  $('goA').disabled=false;
}
async function reset(){
  const em=$('em').value.trim();
  if(!em){$('err').textContent='اكتبي إيميلك الأول.';return;}
  try{await sendPasswordResetEmail(auth,em);$('err').textContent='';alert('بعتنا لك رسالة على الإيميل لتغيير الباسورد.');}
  catch(x){$('err').textContent=authMsg(x.code);}
}
function out(){signOut(auth);}

onAuthStateChanged(auth,async u=>{
  user=u;
  if(!u){show('auth');return;}
  show('ld');
  try{
    const s=await getDoc(doc(db,'stores',u.uid));
    if(s.exists()){store=s.data();await loadProds();showDash();}
    else show('setup');
  }catch(x){alert('مشكلة في تحميل البيانات: '+x.message);show('auth');}
});

function normPhone(p){let n=String(p).replace(/\D/g,'');if(n.startsWith('00'))n=n.slice(2);if(n.startsWith('0'))n='20'+n.slice(1);else if(n.length==10&&n[0]=='1')n='20'+n;return n;}

$('ss').addEventListener('input',()=>{$('ss').value=$('ss').value.toLowerCase().replace(/[^a-z0-9-]/g,'');$('pv').textContent=$('ss').value||'...';});
async function createStore(){
  const name=$('sn').value.trim(),slug=$('ss').value.trim(),wa=normPhone($('sw').value),er=$('err2');
  er.textContent='';
  if(!name)return er.textContent='اكتبي اسم المتجر';
  if(!/^[a-z0-9-]{3,30}$/.test(slug))return er.textContent='اللينك لازم يكون 3 حروف إنجليزي أو أرقام على الأقل';
  if(wa.length<11)return er.textContent='رقم الواتساب مش مظبوط';
  try{
    const sd=await getDoc(doc(db,'slugs',slug));
    if(sd.exists()&&sd.data().uid!==user.uid)return er.textContent='اللينك ده مستخدم، اختاري غيره';
    if(!sd.exists())await setDoc(doc(db,'slugs',slug),{uid:user.uid});
    store={name,slug,tagline:'',whatsapp:wa,color:$('sc').value,theme:'light',shipping:40,freeOver:0,payments:['الدفع عند الاستلام','فودافون كاش','إنستاباي'],badges:['🚚 توصيل لكل المحافظات','💵 دفع عند الاستلام'],logo:'',expiresAt:Timestamp.fromMillis(Date.now()+7*864e5),createdAt:Date.now()};
    await setDoc(doc(db,'stores',user.uid),store);
    prods=[];showDash();
  }catch(x){er.textContent='حصل خطأ: '+x.message;}
}

async function loadProds(){
  const q=await getDocs(collection(db,'stores',user.uid,'products'));
  prods=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
}
const link=()=>new URL('store.html?s='+store.slug,location.href).href;
const thumb=u=>u.replace('/upload/','/upload/f_auto,q_auto,w_200,h_200,c_fill/');
function showDash(){
  show('dash');
  document.documentElement.style.setProperty('--c',store.color||'#ec4899');
  $('dn').textContent=store.name;$('lk').textContent=link();
  drawSub();drawProds();fillSet();tab('p');
}
const renew=()=>'<a href="https://wa.me/'+SUPPORT_WHATSAPP+'?text='+encodeURIComponent('عايزة أجدد اشتراك متجر '+store.name)+'" target="_blank">جددي من هنا</a>';
function drawSub(){
  const d=Math.ceil((store.expiresAt.toMillis()-Date.now())/864e5),b=$('sub');
  if(d<=0){b.className='sub bad';b.innerHTML='⛔ اشتراكك انتهى والمتجر متوقف. '+renew();}
  else if(d<=3){b.className='sub warn';b.innerHTML='⚠️ باقي '+d+' يوم على انتهاء الاشتراك. '+renew();}
  else{b.className='sub ok';b.textContent='✅ اشتراكك شغال، باقي '+d+' يوم';}
}
function drawProds(){
  $('pl').innerHTML=prods.map(p=>`<div class="pr">
    <div class="pi">${p.img?`<img src="${e(thumb(p.img))}" alt="">`:'🛍️'}</div>
    <div class="pm"><b>${e(p.name)}</b>
      <div class="pc">${p.price} ج${p.soldOut?' • <span class="red">نفدت</span>':''}</div>
      <div class="pa"><button onclick="openP('${p.id}')">تعديل</button><button onclick="togSO('${p.id}')">${p.soldOut?'متاح':'نفدت'}</button><button class="dl" onclick="delP('${p.id}')">حذف</button></div>
    </div></div>`).join('')||'<div class="emp">لسه مفيش منتجات. اضغطي "إضافة منتج" وابدأي 💕</div>';
}
function tab(t){$('tp').hidden=t!='p';$('ts').hidden=t!='s';$('tb1').classList.toggle('on',t=='p');$('tb2').classList.toggle('on',t=='s');}
function copyLink(){navigator.clipboard.writeText(link()).then(()=>alert('تم نسخ اللينك ✓')).catch(()=>prompt('انسخي اللينك:',link()));}
function shareWA(){window.open('https://wa.me/?text='+encodeURIComponent('تفضلي متجري 💕\n'+link()));}
function openStore(){window.open(link(),'_blank');}

function shrink(file,max=1100){return new Promise((res,rej)=>{
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',.85);};
  im.onerror=()=>rej(new Error('الصورة مش مقروءة'));im.src=u;
});}
async function upload(file){
  const fd=new FormData();fd.append('file',await shrink(file));fd.append('upload_preset',UPLOAD_PRESET);
  const r=await fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload',{method:'POST',body:fd});
  const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'upload');
  return j.secure_url;
}
function setImg(){
  if(imgUrl){$('pimg').src=thumb(imgUrl).replace('w_200,h_200','w_500,h_500');$('pimg').hidden=false;$('pph').hidden=true;}
  else{$('pimg').hidden=true;$('pph').hidden=false;$('pph').textContent='📷 اضغطي لإضافة صورة';}
}
$('file').onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  $('pimg').hidden=true;$('pph').hidden=false;$('pph').textContent='⏳ جاري رفع الصورة...';$('svp').disabled=true;
  try{imgUrl=await upload(f);}catch(x){alert('فشل رفع الصورة: '+x.message);}
  setImg();$('svp').disabled=false;ev.target.value='';
};
function openP(id){
  editId=id||null;const p=id?prods.find(x=>x.id==id):{};
  $('st').textContent=id?'تعديل المنتج':'منتج جديد';
  $('pn').value=p.name||'';$('pp').value=p.price||'';$('po').value=p.old||'';$('pc').value=p.cat||'';$('pd').value=p.desc||'';
  $('pl2').value=p.optLabel||'';$('pops').value=(p.opts||[]).join('، ');$('pso').checked=!!p.soldOut;
  imgUrl=p.img||'';setImg();$('sheet').classList.add('on');
}
function closeP(){$('sheet').classList.remove('on');}
const saveP=tc(async()=>{
  const name=$('pn').value.trim(),price=+$('pp').value;
  if(!name||!(price>0))return alert('اكتبي اسم المنتج وسعره');
  const d={name,price,old:+$('po').value||0,cat:$('pc').value.trim(),desc:$('pd').value.trim(),optLabel:$('pl2').value.trim(),opts:split($('pops').value),img:imgUrl,soldOut:$('pso').checked};
  $('svp').disabled=true;
  try{
    const col=collection(db,'stores',user.uid,'products');
    if(editId)await updateDoc(doc(col,editId),d);else await addDoc(col,{...d,ts:Date.now()});
    await loadProds();drawProds();closeP();
  }finally{$('svp').disabled=false;}
});
const togSO=tc(async id=>{const p=prods.find(x=>x.id==id);await updateDoc(doc(db,'stores',user.uid,'products',id),{soldOut:!p.soldOut});p.soldOut=!p.soldOut;drawProds();});
const delP=tc(async id=>{if(!confirm('حذف المنتج؟'))return;await deleteDoc(doc(db,'stores',user.uid,'products',id));prods=prods.filter(x=>x.id!=id);drawProds();});

function drawLogo(){$('lgimg').hidden=!logoUrl;if(logoUrl)$('lgimg').src=thumb(logoUrl);$('lgtxt').hidden=!!logoUrl;$('lgtxt').textContent='📷 إضافة لوجو';}
$('lgfile').onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  try{logoUrl=await upload(f);drawLogo();}catch(x){alert('فشل رفع اللوجو: '+x.message);}
  ev.target.value='';
};
function fillSet(){
  $('f_name').value=store.name;$('f_tag').value=store.tagline||'';$('f_wa').value=store.whatsapp;
  $('f_col').value=store.color||'#ec4899';$('f_theme').value=store.theme||'light';
  $('f_ship').value=store.shipping==null?40:store.shipping;$('f_free').value=store.freeOver||0;
  $('f_pay').value=(store.payments||[]).join('، ');$('f_bad').value=(store.badges||[]).join('، ');
  logoUrl=store.logo||'';drawLogo();
}
const saveSet=tc(async()=>{
  const wa=normPhone($('f_wa').value);
  if(wa.length<11)return alert('رقم الواتساب مش مظبوط');
  const upd={name:$('f_name').value.trim()||store.name,tagline:$('f_tag').value.trim(),whatsapp:wa,color:$('f_col').value,theme:$('f_theme').value,shipping:+$('f_ship').value||0,freeOver:+$('f_free').value||0,payments:split($('f_pay').value),badges:split($('f_bad').value),logo:logoUrl};
  await updateDoc(doc(db,'stores',user.uid),upd);
  Object.assign(store,upd);showDash();tab('s');alert('تم الحفظ ✓');
});

Object.assign(window,{mode,doAuth,reset,out,createStore,openP,closeP,saveP,togSO,delP,tab,saveSet,copyLink,shareWA,openStore});
</script>
